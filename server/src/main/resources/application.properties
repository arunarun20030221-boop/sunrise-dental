# =====================================================================================
# Sunrise Dental Clinic - application settings
#
# Database credentials are read from the environment first (DB_URL, DB_USERNAME,
# DB_PASSWORD) and fall back to these values, so a real deployment supplies its own
# credentials without them ever being committed. See PersistenceConfig#setting.
# =====================================================================================

db.url=jdbc:postgresql://localhost:5432/sunrise_dental
db.username=postgres
db.password=

# ------------------------------- Clinic settings -------------------------------------
clinic.name=Sunrise Dental Clinic
clinic.address=45 Galle Road, Colombo 03
clinic.phone=+94 11 234 5678
clinic.currency=LKR

# Standard consultation charge added to every bill, per the billing requirement.
clinic.consultation-fee=2000.00

# Opening hours: bookings outside this window are rejected by AppointmentSchedulingRules.
clinic.opening-time=08:00
clinic.closing-time=18:00

# ---------------------------------- Email --------------------------------------------
# Leave mail.host blank to disable sending: NotificationService then logs the message
# it would have sent, so the application runs without SMTP credentials.
mail.host=
mail.port=587
mail.username=
mail.password=
